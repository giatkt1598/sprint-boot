name: sprint-boot

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: sprintboot
      POSTGRES_USER: ${POSTGRES_USER:-sprintboot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sprintboot}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  rabbitmq:
    image: rabbitmq:4-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-sprintboot}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-sprintboot}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_UI_PORT:-15672}:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 20

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "${SMTP_PORT:-1025}:1025"
      - "${MAILPIT_UI_PORT:-8025}:8025"

  keycloak:
    image: quay.io/keycloak/keycloak:26.4
    profiles: ["sso"]
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    ports:
      - "${KEYCLOAK_PORT:-8180}:8080"
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro

  # Bind DN cn=admin,dc=sso,dc=local, password admin; people live under ou=people,dc=sso,dc=local.
  openldap:
    image: osixia/openldap:1.5.0
    profiles: ["sso"]
    command: ["--copy-service"]
    environment:
      LDAP_DOMAIN: sso.local
      LDAP_ORGANISATION: Sprint Boot SSO
      LDAP_ADMIN_PASSWORD: admin
    ports:
      - "${LDAP_PORT:-1389}:389"
    volumes:
      - ./openldap/50-people.ldif:/container/service/slapd/assets/config/bootstrap/ldif/custom/50-people.ldif:ro

  # S3-compatible storage, to try direct part uploads: Storage__Provider=S3, Storage__S3__Endpoint=http://localhost:4566,
  # Storage__S3__Bucket=sprint-boot, any access and secret key. The bucket and its CORS rules are created on start.
  s3:
    image: localstack/localstack:4
    profiles: ["s3"]
    environment:
      SERVICES: s3
    ports:
      - "${S3_PORT:-4566}:4566"
    volumes:
      - ./localstack/create-bucket.sh:/etc/localstack/init/ready.d/create-bucket.sh:ro

  gitea:
    image: gitea/gitea:1.24
    profiles: ["git"]
    environment:
      GITEA__security__INSTALL_LOCK: "true"
      GITEA__server__ROOT_URL: "http://localhost:${GITEA_PORT:-3300}/"
      GITEA__webhook__ALLOWED_HOST_LIST: "*"
      GITEA__webhook__DELIVER_TIMEOUT: "10"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${GITEA_PORT:-3300}:3000"
    volumes:
      - gitea-data:/data

volumes:
  gitea-data:
  postgres-data:
  redis-data:
  rabbitmq-data:
