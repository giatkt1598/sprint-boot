name: Build Docker images

on:
  push:
    branches:
      - master
    tags:
      - "v*"
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # api = SprintBoot.Host + SprintBoot.DbMigrator, web = SPA + nginx proxy to the API
          - name: api
            file: apps/api/Dockerfile
          - name: web
            file: apps/web/Dockerfile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure image name
        shell: bash
        run: |
          registry="${{ gitea.server_url }}"
          registry="${registry#https://}"
          registry="${registry#http://}"
          echo "REGISTRY=${registry}" >> "$GITHUB_ENV"
          echo "IMAGE_NAME=${registry}/${{ gitea.repository }}/${{ matrix.name }}" >> "$GITHUB_ENV"

      - name: Set image tag
        id: image
        shell: bash
        run: |
          if [[ "${{ gitea.event_name }}" == "push" && "${{ gitea.ref }}" == "refs/heads/master" ]]; then
            # every push to master gets its own tag: master-<workflow run number> (matches k8s-bump branch-run)
            tag="master-${{ gitea.run_number }}"
          else
            # docker tags allow [A-Za-z0-9_.-]
            tag="$(echo "${{ gitea.ref_name }}" | tr -c 'A-Za-z0-9_.-' '-' | sed 's/-*$//')"
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      - name: Log in to Gitea Container Registry
        if: gitea.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ gitea.actor }}
          password: ${{ secrets.TOKEN }}

      - name: Build Docker image
        run: |
          docker build \
            --tag "${IMAGE_NAME}:${{ steps.image.outputs.tag }}" \
            --tag "${IMAGE_NAME}:sha-${GITHUB_SHA::12}" \
            --label "org.opencontainers.image.source=${{ gitea.server_url }}/${{ gitea.repository }}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --file "${{ matrix.file }}" \
            .

      - name: Push Docker image
        if: gitea.event_name != 'pull_request'
        run: |
          docker push "${IMAGE_NAME}:${{ steps.image.outputs.tag }}"
          docker push "${IMAGE_NAME}:sha-${GITHUB_SHA::12}"

          if [[ "${{ gitea.ref_name }}" == "master" ]]; then
            docker tag "${IMAGE_NAME}:${{ steps.image.outputs.tag }}" "${IMAGE_NAME}:latest"
            docker push "${IMAGE_NAME}:latest"
          fi

  # Deploy: write the new tags (master-<run>) into base/kustomization.yaml of giatk-k8s so Argo CD rolls them out.
  # Shared logic lives in admin/workflows; it only acts on pushes to the default branch.
  deploy:
    needs: build
    uses: admin/workflows/.gitea/workflows/k8s-bump.yml@v1
    with:
      default_branch: master
      tag_strategy: branch-run
      images: '[{"name": "api"}, {"name": "web"}]'
    secrets:
      TOKEN: ${{ secrets.TOKEN }}
