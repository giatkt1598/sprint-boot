# Serves the SPA and proxies the API paths (same list as the Vite dev proxy) to the API Service.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# The TLS edge (Cloudflare Tunnel) sets X-Forwarded-Proto; keep it so the API issues https URLs.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

upstream sprint_boot_api {
    server sprint-boot-api:8080;
}

server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;

    # Attachments are capped at 25 MB by the API (Issues:Attachments:MaxFileSizeMb).
    client_max_body_size 30m;

    location ~ ^/(api|connect|\.well-known|hubs|swagger|mcp)(/|$) {
        proxy_pass http://sprint_boot_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_read_timeout 3600s;
        proxy_buffering off;
    }

    # Vite puts a content hash in every file name under /assets.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
