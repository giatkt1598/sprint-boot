<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <title>Sprint Boot</title>
    <meta name="color-scheme" content="light dark" />
    <script>
      // Applies the saved look before the first paint, so a dark page never flashes light. Mirrors theme/appearance.ts.
      try {
        var saved = JSON.parse(localStorage.getItem('sb.appearance') || 'null') || {};
        var root = document.documentElement;
        var dark = saved.colorMode === 'dark' || ((saved.colorMode || 'system') === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
        root.dataset.theme = dark ? 'dark' : 'light';
        root.dataset.accent = saved.accent || 'blue';
        root.dataset.font = saved.fontFamily || 'poppins';
        root.style.setProperty('--sb-font-scale', String((saved.fontScale || 100) / 100));
        if (saved.backgroundUrl) {
          root.dataset.background = 'on';
          root.style.setProperty('--sb-bg-image', 'url("' + saved.backgroundUrl + '")');
          root.style.setProperty('--sb-bg-cover', (100 - (saved.backgroundOpacity == null ? 30 : saved.backgroundOpacity)) + '%');
        }
      } catch (error) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
