<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <title>Sprint Boot</title>
    <meta name="color-scheme" content="light dark" />
    <script>
      // Applies the saved look before the first paint, so a dark theme never flashes light. Mirrors theme/appearance.ts.
      try {
        // The themes whose base is dark; a test keeps this list in step with theme/themes.
        var DARK_THEMES = ['dark', 'aurora', 'glass', 'fire', 'vietnamese'];
        var saved = JSON.parse(localStorage.getItem('sb.appearance') || 'null') || {};
        var root = document.documentElement;
        var theme = saved.theme;
        if (!theme) {
          // Saved before themes existed, when dark was a colour mode.
          var dark = saved.colorMode === 'dark' || (saved.colorMode === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
          theme = dark ? 'dark' : 'classic';
        }
        root.dataset.appTheme = theme;
        root.dataset.theme = DARK_THEMES.indexOf(theme) >= 0 ? 'dark' : 'light';
        root.dataset.accent = saved.accent || 'blue';
        root.dataset.font = saved.fontFamily || 'poppins';
        root.dataset.motion = saved.motion || 'full';
        root.style.setProperty('--sb-font-scale', String((saved.fontScale || 100) / 100));
        if (saved.backgroundUrl) {
          root.dataset.background = 'on';
          root.style.setProperty('--sb-bg-image', 'url("' + saved.backgroundUrl + '")');
          root.style.setProperty('--sb-bg-cover', (100 - (saved.backgroundOpacity == null ? 30 : saved.backgroundOpacity)) + '%');
        }
      } catch (error) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
